name: Flake report
description: A test that passed and failed on the same tree. Name the test file and the test.
body:
  - type: markdown
    attributes:
      value: |-
        > [!WARNING]
        > Bridlewise is an experimental developer preview. Do not paste credentials, private source, personal data, absolute home paths or database contents. Every text field here is plain text and takes no file attachment: paste logs as text, redacted first.
  - type: input
    id: test-path
    attributes:
      label: Test file
      description: The repository-relative path of the test file.
      placeholder: engine/test/workflow/record-links.test.ts
    validations:
      required: true
  - type: input
    id: test-name
    attributes:
      label: Test name
      description: The test's name as the runner printed it.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: The commit SHA both runs used.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What you saw
      description: The failing assertion or refusal text, and how often it failed.
      render: text
    validations:
      required: true
  - type: input
    id: run
    attributes:
      label: Run link
      description: A link to the failing CI run, if there is one.
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This report contains no credentials, private source or personal data.
          required: true
        - label: I understand this is a developer preview with no support SLA.
          required: true
