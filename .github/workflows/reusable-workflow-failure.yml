name: Report workflow failure

on:
  workflow_call:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  report:
    name: Open or close the failure issue
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_NAME: ${{ github.event.workflow_run.name }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      EVENT: ${{ github.event.workflow_run.event }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - name: Report failure or recovery
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUN_CONCLUSION" != "failure" ] && [ "$RUN_CONCLUSION" != "success" ]; then
            echo "No issue action for conclusion: $RUN_CONCLUSION"
            exit 0
          fi

          # A merge-queue run reports on its own pull request: a failed group
          # removes the PR from the queue, and its throwaway
          # gh-readonly-queue/* branch never recovers, so an issue for it
          # would stay open forever.
          if [ "$EVENT" = "merge_group" ]; then
            echo "No issue action for a merge-queue run: the queue reports it on the PR"
            exit 0
          fi

          if [ -n "${PR_NUMBER:-}" ]; then
            target="PR #${PR_NUMBER}"
          elif [ -n "${HEAD_BRANCH:-}" ]; then
            target="branch ${HEAD_BRANCH}"
          else
            target="commit ${HEAD_SHA:0:7}"
          fi
          title="Workflow failure: ${RUN_NAME} on ${target}"

          # ci-failure is declared in docs/community/labels.json and written by
          # the forge alone (harness forge apply): this report only uses it, and
          # a missing label is a loud failure here, never a label made on the fly.
          if ! gh api "repos/${GH_REPO}/labels/ci-failure" --silent; then
            echo "::error::the declared ci-failure label is missing on ${GH_REPO}: run harness forge apply" >&2
            exit 1
          fi

          existing="$(gh issue list \
            --state open \
            --label ci-failure \
            --limit 100 \
            --json number,title \
            | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' \
            | head -n 1)"

          if [ "$RUN_CONCLUSION" = "success" ]; then
            if [ -z "$existing" ]; then
              echo "No open failure issue for: $title"
              exit 0
            fi
            gh issue comment "$existing" --body "Recovered by ${RUN_URL} at ${HEAD_SHA}."
            gh issue close "$existing"
            echo "Closed issue #${existing}"
            exit 0
          fi

          jobs="$(gh api \
            "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?filter=latest" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')"
          if [ -z "$jobs" ]; then
            jobs="No failed job name was returned by the API."
          fi

          body="$(printf '%s\n' \
            '## Failed workflow' \
            '' \
            "- Workflow: ${RUN_NAME}" \
            "- Repository: ${GH_REPO}" \
            "- Scope: ${target}" \
            "- Commit: ${HEAD_SHA}" \
            "- Event: ${EVENT}" \
            "- Run: ${RUN_URL}" \
            "- Failed jobs: ${jobs}" \
            '' \
            'This issue is opened by the reusable failure reporter. It closes automatically when the same workflow succeeds for the same branch or pull request.')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Another failure was recorded: ${RUN_URL}"
            echo "Updated issue #${existing}"
          else
            url="$(gh issue create \
              --title "$title" \
              --body "$body" \
              --label ci-failure)"
            echo "Opened issue ${url}"
          fi
