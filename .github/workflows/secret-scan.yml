name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret and privacy scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The scanner reads the tree through the engine's own policy owners
      # (secret-files → root-policy), so it needs the installed dependencies;
      # without them it dies on the first import, which is not a scan verdict.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the public-snapshot scanner
        run: node scripts/check-secrets.mjs
