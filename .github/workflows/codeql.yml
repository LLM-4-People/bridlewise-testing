# GENERATED by harness sync from engine/src/workflow/gates/ — edit the owner, never this file
name: CodeQL
on:
  pull_request: {}
  merge_group: {}
  push:
    branches:
      - main
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('codeql-pr-{0}', github.event.pull_request.number) || format('codeql-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Install the pinned compiler
        if: ${{ matrix.build-mode == 'manual' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14
      - name: Build the guardian
        if: ${{ matrix.build-mode == 'manual' }}
        run: make -C engine/guardian all
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
