# GENERATED by harness sync from engine/src/workflow/gates/ — edit the owner, never this file
name: CI
"on":
  pull_request: {}
  merge_group: {}
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      cells: ${{ steps.plan.outputs.cells }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json
      - name: Install engine dependencies
        run: npm --prefix engine ci --no-audit --no-fund
      - name: Enforce the self-protection config mode
        run: chmod 600 engine/bridlewise.config.json
      - name: Give the job its own temporary root
        run: |
          mkdir -p "$HOME/.cache/bridlewise-tmp/ci"
          echo "TMPDIR=$HOME/.cache/bridlewise-tmp/ci" >> "$GITHUB_ENV"
      - name: Plan the gate cells
        id: plan
        run: node engine/src/cli.ts harness gates plan --out "$RUNNER_TEMP/gate-plan" --github-output "$GITHUB_OUTPUT"
      - name: Upload the plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gate-plan
          path: ${{ runner.temp }}/gate-plan
          if-no-files-found: error
          retention-days: 90
  light:
    name: light
    needs:
      - plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Install engine dependencies
        run: npm --prefix engine ci --no-audit --no-fund
      - name: Enforce the self-protection config mode
        run: chmod 600 engine/bridlewise.config.json
      - name: Give the job its own temporary root
        run: |
          mkdir -p "$HOME/.cache/bridlewise-tmp/ci"
          echo "TMPDIR=$HOME/.cache/bridlewise-tmp/ci" >> "$GITHUB_ENV"
      - name: Install the pinned compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14
      - name: "Set up: bundle"
        run: node engine/src/cli.ts harness gates setup bundle
      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate-plan
          path: ${{ runner.temp }}/gate-plan
      - name: Typecheck web, server, templates and tests
        if: ${{ !cancelled() }}
        run: node engine/src/cli.ts harness gates run typecheck-web --plan "$RUNNER_TEMP/gate-plan/plan.json" --out "$RUNNER_TEMP/gate-results"
      - name: Typecheck engine and engine tests
        if: ${{ !cancelled() }}
        run: node engine/src/cli.ts harness gates run typecheck-engine --plan "$RUNNER_TEMP/gate-plan/plan.json" --out "$RUNNER_TEMP/gate-results"
      - name: Harness check (generated values, bindings, guards)
        if: ${{ !cancelled() }}
        run: node engine/src/cli.ts harness gates run harness-check --plan "$RUNNER_TEMP/gate-plan/plan.json" --out "$RUNNER_TEMP/gate-results"
      - name: Secret and privacy scan
        if: ${{ !cancelled() }}
        run: node engine/src/cli.ts harness gates run secret-tree-scan --plan "$RUNNER_TEMP/gate-plan/plan.json" --out "$RUNNER_TEMP/gate-results"
      - name: Relative Markdown links
        if: ${{ !cancelled() }}
        run: node engine/src/cli.ts harness gates run docs-links --plan "$RUNNER_TEMP/gate-plan/plan.json" --out "$RUNNER_TEMP/gate-results"
      - name: Public smoke tests
        if: ${{ !cancelled() }}
        run: node engine/src/cli.ts harness gates run public-tests --plan "$RUNNER_TEMP/gate-plan/plan.json" --out "$RUNNER_TEMP/gate-results"
      - name: Build the cockpit
        if: ${{ !cancelled() }}
        run: node engine/src/cli.ts harness gates run build-web --plan "$RUNNER_TEMP/gate-plan/plan.json" --out "$RUNNER_TEMP/gate-results"
      - name: Build and test the guardian
        if: ${{ !cancelled() }}
        run: node engine/src/cli.ts harness gates run guardian --plan "$RUNNER_TEMP/gate-plan/plan.json" --out "$RUNNER_TEMP/gate-results"
      - name: Upload the gate results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gate-results-light
          path: ${{ runner.temp }}/gate-results
          if-no-files-found: error
          retention-days: 90
      - name: Upload the gate logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gate-logs-light
          path: ${{ env.TMPDIR }}/**/*.log
          if-no-files-found: ignore
          retention-days: 30
  shard:
    name: ${{ matrix.title }}
    needs:
      - plan
    if: ${{ needs.plan.outputs.cells != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cells) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Install engine dependencies
        run: npm --prefix engine ci --no-audit --no-fund
      - name: Enforce the self-protection config mode
        run: chmod 600 engine/bridlewise.config.json
      - name: Give the job its own temporary root
        run: |
          mkdir -p "$HOME/.cache/bridlewise-tmp/ci"
          echo "TMPDIR=$HOME/.cache/bridlewise-tmp/ci" >> "$GITHUB_ENV"
      - name: Install the pinned compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14
      - name: Allow unprivileged user and mount namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        if: ${{ contains(fromJSON('["engine-suite"]'), matrix.gate) }}
      - name: Install the tracked hooks
        run: npm run bootstrap:hooks
      - name: Fetch and verify the pinned corpus subset
        run: |
          npm run corpus:fetch
          npm run corpus:verify
        if: ${{ contains(fromJSON('["engine-suite"]'), matrix.gate) }}
      - name: "Set up: bundle"
        run: node engine/src/cli.ts harness gates setup bundle
      - name: "Set up: guardian"
        run: node engine/src/cli.ts harness gates setup guardian
      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate-plan
          path: ${{ runner.temp }}/gate-plan
      - name: Run the shard
        env:
          CELL: ${{ matrix.cell }}
        run: node engine/src/cli.ts harness gates shard "$CELL" --plan "$RUNNER_TEMP/gate-plan/plan.json" --out "$RUNNER_TEMP/gate-results"
      - name: Upload the gate results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gate-results-${{ matrix.cell }}
          path: ${{ runner.temp }}/gate-results
          if-no-files-found: error
          retention-days: 90
      - name: Upload the gate logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gate-logs-${{ matrix.cell }}
          path: ${{ env.TMPDIR }}/**/*.log
          if-no-files-found: ignore
          retention-days: 30
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
  seal:
    name: seal
    needs:
      - plan
      - light
      - shard
      - dependency-review
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json
      - name: Install engine dependencies
        run: npm --prefix engine ci --no-audit --no-fund
      - name: Enforce the self-protection config mode
        run: chmod 600 engine/bridlewise.config.json
      - name: Give the job its own temporary root
        run: |
          mkdir -p "$HOME/.cache/bridlewise-tmp/ci"
          echo "TMPDIR=$HOME/.cache/bridlewise-tmp/ci" >> "$GITHUB_ENV"
      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate-plan
          path: ${{ runner.temp }}/gate-plan
      - name: Download every gate result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gate-results-*
          path: ${{ runner.temp }}/gate-results
          merge-multiple: true
      - name: Seal the receipt
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: node engine/src/cli.ts harness gates seal --plan "$RUNNER_TEMP/gate-plan/plan.json" --results "$RUNNER_TEMP/gate-results" --out "$RUNNER_TEMP/gate-receipt"
      - name: Upload the receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gate-receipt
          path: ${{ runner.temp }}/gate-receipt
          if-no-files-found: error
          retention-days: 90
