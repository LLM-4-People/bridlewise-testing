name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's newer push supersedes its older run. Every other event
  # (main pushes, merge groups, schedules, dispatches) gets a group of its own,
  # so a main run is never cancelled, neither in progress nor pending.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine-suite:
    name: Engine suite
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        run: npm --prefix engine ci --no-audit --no-fund

      - name: Require the pinned compiler from the runner image
        run: |
          # gcc-14 ships in the ubuntu-24.04 image. Installing it over the
          # network only ever waited on a package mirror (a hung mirror held
          # two shards for their whole 45-minute budget, #333). A missing
          # compiler is a named failure, never an install.
          command -v gcc-14 >/dev/null || { echo "::error::gcc-14 is not in the runner image; the guardian build needs it (#333)"; exit 1; }
          gcc-14 --version

      - name: Install hooks and build the confinement supervisor
        run: |
          npm run bootstrap:hooks
          chmod 600 engine/bridlewise.config.json
          npm --prefix engine run build:bundle
          make -C engine/guardian all

      - name: Fetch the pinned corpus subset
        run: |
          npm run corpus:fetch
          npm run corpus:verify

      # The image sets kernel.apparmor_restrict_unprivileged_userns=1. The
      # namespace proofs (keep-out aliases, the procfs-less door, S1-B04/B13)
      # need unprivileged user and mount namespaces, and refuse by name
      # without them (#149): the job provides the capability, never a skip.
      - name: Allow unprivileged user and mount namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # D-19: a run's temporary root lies under the per-user cache, outside
      # the safety floor (the instrument-lock proof places a checkout there).
      - name: DIAGNOSTIC watch the live config (#293, #132)
        run: |
          sudo apt-get install -y -qq auditd >/dev/null
          sudo systemctl start auditd || sudo service auditd start
          cfg="$PWD/engine/bridlewise.config.json"
          sudo auditctl -D
          sudo auditctl -b 65536 --backlog_wait_time 60000
          sudo auditctl -w "$cfg" -p wa -k cfgw
          sudo auditctl -a always,exit -F arch=b64 -S execve -F auid!=4294967295 -k execs || true
          sudo auditctl -a always,exit -F arch=b64 -S execve -k execs
          sudo auditctl -l
          stat -c 'START %n mode=%a size=%s mtime=%.Y ctime=%.Z ino=%i' "$cfg"

      - name: Run the engine suite
        run: |
          mkdir -p "$HOME/.cache/bridlewise-tmp/ci"
          TMPDIR="$HOME/.cache/bridlewise-tmp/ci" npm --prefix engine test

      # The runner writes its verdict to one summary file; the job prints the
      # failing tests and their reasons, so a red run is readable without a
      # local reproduction.
      - name: Report the engine suite's failures
        if: always()
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "engine/.bridlewise/state/test-results/latest-summary.json";
            if (!fs.existsSync(path)) { console.log("no summary: the runner recorded no result"); process.exit(0); }
            const s = JSON.parse(fs.readFileSync(path, "utf8"));
            const lines = [`## Engine suite: ${s.status}`, "", `${s.passCount} passed, ${s.failCount} failed of ${s.testCount}`, ""];
            for (const failure of s.failures) lines.push(`- ${failure}`);
            if (s.reasons.length > 0) lines.push("", "### Reasons", "", ...s.reasons.map((reason) => `- ${reason}`));
            const text = lines.join("\n") + "\n";
            process.stdout.write(text);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text);
          '

      - name: DIAGNOSTIC who wrote the live config
        if: always()
        run: |
          cfg="$PWD/engine/bridlewise.config.json"
          stat -c 'END %n mode=%a size=%s mtime=%.Y ctime=%.Z ino=%i' "$cfg"
          sudo auditctl -D
          sudo cp /var/log/audit/audit.log* "$RUNNER_TEMP"/ 2>/dev/null; sudo chmod a+r "$RUNNER_TEMP"/audit.log*
          sudo ausearch -k cfgw -i 2>/dev/null | head -400
          python3 - "$RUNNER_TEMP" <<'PY'
          import sys, glob, re, collections
          recs = collections.defaultdict(list)
          for f in sorted(glob.glob(sys.argv[1] + "/audit.log*"), reverse=True):
              for line in open(f, errors="replace"):
                  m = re.search(r"msg=audit\(([0-9.]+):(\d+)\)", line)
                  if m: recs[m.group(2)].append(line.strip())
          def field(text, name):
              m = re.search(r"\b" + name + r"=(\"[^\"]*\"|\S+)", text)
              return m.group(1).strip('"') if m else None
          def title(text):
              p = field(text, "proctitle")
              if p is None: return None
              try: return bytes.fromhex(p).replace(b"\0", b" ").decode(errors="replace")
              except ValueError: return p
          proc = {}
          events = []
          for serial, lines in recs.items():
              text = " ".join(lines)
              pid, ppid = field(text, "pid"), field(text, "ppid")
              if pid: proc.setdefault(pid, (ppid, title(text)))
              if "key=\"cfgw\"" in text or "key=cfgw" in text: events.append((serial, text))
          print(f"{len(events)} config events")
          for serial, text in events:
              pid = field(text, "pid")
              print(f"--- serial {serial} syscall={field(text,'syscall')} exe={field(text,'exe')} pid={pid}")
              chain, seen = pid, 0
              while chain and chain in proc and seen < 8:
                  ppid, t = proc[chain]
                  print(f"    pid {chain}: {(t or '?')[:400]}")
                  chain, seen = ppid, seen + 1
          PY
