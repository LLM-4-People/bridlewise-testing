name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's newer push supersedes its older run. Every other event
  # (main pushes, merge groups, schedules, dispatches) gets a group of its own,
  # so a main run is never cancelled, neither in progress nor pending.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Typecheck, public tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json

      - name: Check relative docs links
        run: node scripts/check-docs-links.mjs

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        run: npm --prefix engine ci --no-audit --no-fund

      - name: Install the tracked hooks
        run: npm run bootstrap:hooks

      - name: Enforce the self-protection config mode
        run: chmod 600 engine/bridlewise.config.json

      - name: Verify the shard manifest accounts for every live test file
        run: |
          npm run test:list -- --out "$RUNNER_TEMP/live-manifest.json"
          npm run test:verify-shards -- \
            --manifest tests/test-shards.json \
            --live "$RUNNER_TEMP/live-manifest.json"

      - name: Typecheck web, server, templates, and tests
        run: npm run typecheck

      - name: Typecheck engine and engine tests
        run: npm --prefix engine run typecheck

      - name: Scan for secrets and private paths
        run: npm run check:secrets

      - name: Public smoke tests
        run: npm run test:public

      - name: Build cockpit
        run: npm run build

      - name: Build engine bundle
        run: npm --prefix engine run build:bundle

      - name: Require the pinned compiler from the runner image
        run: |
          # gcc-14 ships in the ubuntu-24.04 image. Installing it over the
          # network only ever waited on a package mirror (a hung mirror held
          # two shards for their whole 45-minute budget, #333). A missing
          # compiler is a named failure, never an install.
          command -v gcc-14 >/dev/null || { echo "::error::gcc-14 is not in the runner image; the guardian build needs it (#333)"; exit 1; }
          gcc-14 --version

      - name: Build guardian
        run: make -C engine/guardian all

      - name: Test guardian
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/guardian-tests.log"
          make -C engine/guardian test | tee "$log"
          bash engine/guardian/tests/require-pass-log.sh "$log"

      - name: Record the guardian build stamp and diagnostic digest
        run: |
          set -o pipefail
          engine/guardian/build/harness-landlock-guardian --stamp | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum engine/guardian/build/harness-landlock-guardian | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the engine prevention guard for unhandled catch blocks
        working-directory: engine
        run: node --experimental-strip-types --test test/prevention/no-unhandled-errors.test.ts

  # Generated values are never edited by hand: hashes, pins, inventories,
  # manifests and README consumer blocks come from `harness sync`. This job
  # runs the generators (with the bundle, so the self-protection pin
  # converges) and requires that they change NO file, tracked or untracked, then relies on
  # the sync's own final `harness check` for every other gate. A stale pin
  # used to reach main unseen (Issue #55): only the commit hook ran the
  # check, and only when an engine file was staged. The gate job above owns
  # the typecheck, so the sync's check skips it.
  generated:
    name: Generated values and harness check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        run: npm --prefix engine ci --no-audit --no-fund

      - name: Enforce the self-protection config mode
        run: chmod 600 engine/bridlewise.config.json

      - name: Run every generator, then harness check
        working-directory: engine
        run: node src/cli.ts harness sync --with-bundle

      # Tracked AND untracked: a generator that writes a new file nobody
      # committed (and no ignore rule covers) is as stale as a changed one.
      - name: Require that the generators changed no file
        run: |
          changed="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed"
            git diff --stat
            echo "::error::a generated value is stale; run 'cd engine && node src/cli.ts harness sync --with-bundle' and commit its output"
            exit 1
          fi

  shards:
    name: Full suite shards
    uses: ./.github/workflows/test-shards.yml
    with:
      shards: "10"
      runner: ubuntu-24.04

  # The engine's own suite (engine/test, run by engine/scripts/tooling/
  # run-tests.ts, the one engine test door). It runs on every pull request
  # and main push and is NOT yet a required check: it becomes one (runbook
  # P0.9) once it is green on hosted runners, with every red fixed or filed
  # as an owned record. Its setup mirrors a shard's: the hooks, the bundle
  # and the confinement supervisor the suite's guards exercise.
  engine-suite:
    name: Engine suite
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        run: npm --prefix engine ci --no-audit --no-fund

      - name: Require the pinned compiler from the runner image
        run: |
          # gcc-14 ships in the ubuntu-24.04 image. Installing it over the
          # network only ever waited on a package mirror (a hung mirror held
          # two shards for their whole 45-minute budget, #333). A missing
          # compiler is a named failure, never an install.
          command -v gcc-14 >/dev/null || { echo "::error::gcc-14 is not in the runner image; the guardian build needs it (#333)"; exit 1; }
          gcc-14 --version

      - name: Install hooks and build the confinement supervisor
        run: |
          npm run bootstrap:hooks
          chmod 600 engine/bridlewise.config.json
          npm --prefix engine run build:bundle
          make -C engine/guardian all

      - name: Fetch the pinned corpus subset
        run: |
          npm run corpus:fetch
          npm run corpus:verify

      # The image sets kernel.apparmor_restrict_unprivileged_userns=1. The
      # namespace proofs (keep-out aliases, the procfs-less door, S1-B04/B13)
      # need unprivileged user and mount namespaces, and refuse by name
      # without them (#149): the job provides the capability, never a skip.
      - name: Allow unprivileged user and mount namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # D-19: a run's temporary root lies under the per-user cache, outside
      # the safety floor (the instrument-lock proof places a checkout there).
      - name: Run the engine suite
        run: |
          mkdir -p "$HOME/.cache/bridlewise-tmp/ci"
          TMPDIR="$HOME/.cache/bridlewise-tmp/ci" npm --prefix engine test

      # The runner writes its verdict to one summary file; the job prints the
      # failing tests and their reasons, so a red run is readable without a
      # local reproduction.
      - name: Report the engine suite's failures
        if: always()
        # The report is the tests' own text: the script wraps the log copy so
        # no line of it runs as a workflow command, and caps it below the step
        # summary's limit (engine/scripts/tooling/test-run-report.ts).
        run: node engine/scripts/tooling/test-run-report.ts
