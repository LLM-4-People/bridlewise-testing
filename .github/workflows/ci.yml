name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's newer push supersedes its older run. Every other event
  # (main pushes, merge groups, schedules, dispatches) gets a group of its own,
  # so a main run is never cancelled, neither in progress nor pending.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Typecheck, public tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json

      - name: Check relative docs links
        run: node scripts/check-docs-links.mjs

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up the engine
        uses: ./.github/actions/engine-setup
        with:
          ignore-scripts: "false"

      - name: Install the tracked hooks
        run: npm run bootstrap:hooks

      - name: Verify the derived shard population is the runner's selection
        run: |
          npm run test:list -- --out "$RUNNER_TEMP/live-manifest.json"
          npm run test:verify-shards -- \
            --live "$RUNNER_TEMP/live-manifest.json"

      - name: Typecheck web, server, templates, and tests
        run: npm run typecheck

      - name: Typecheck engine and engine tests
        run: npm --prefix engine run typecheck

      - name: Scan for secrets and private paths
        run: npm run check:secrets

      - name: Public smoke tests
        run: npm run test:public

      - name: Build cockpit
        run: npm run build

      - name: Build engine bundle
        run: npm --prefix engine run build:bundle

      - name: Require the pinned compiler from the runner image
        run: |
          # gcc-14 ships in the ubuntu-24.04 image. Installing it over the
          # network only ever waited on a package mirror (a hung mirror held
          # two shards for their whole 45-minute budget, #333). A missing
          # compiler is a named failure, never an install.
          command -v gcc-14 >/dev/null || { echo "::error::gcc-14 is not in the runner image; the guardian build needs it (#333)"; exit 1; }
          gcc-14 --version

      - name: Build guardian
        run: make -C engine/guardian all

      - name: Test guardian
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/guardian-tests.log"
          make -C engine/guardian test | tee "$log"
          bash engine/guardian/tests/require-pass-log.sh "$log"

      - name: Record the guardian build stamp and diagnostic digest
        run: |
          set -o pipefail
          engine/guardian/build/harness-landlock-guardian --stamp | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum engine/guardian/build/harness-landlock-guardian | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the engine prevention guard for unhandled catch blocks
        working-directory: engine
        run: node --experimental-strip-types --test test/prevention/no-unhandled-errors.test.ts

  # Generated values are never edited by hand: hashes, pins, inventories,
  # manifests and README consumer blocks come from `harness sync`. This job
  # runs the generators (with the bundle, so the self-protection pin
  # converges) and requires that they change NO file, tracked or untracked, then relies on
  # the sync's own final `harness check` for every other gate. A stale pin
  # used to reach main unseen (Issue #55): only the commit hook ran the
  # check, and only when an engine file was staged. The gate job above owns
  # the typecheck, so the sync's check skips it.
  generated:
    name: Generated values and harness check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up the engine
        uses: ./.github/actions/engine-setup
        with:
          ignore-scripts: "false"

      - name: Run every generator, then harness check
        working-directory: engine
        run: node src/cli.ts harness sync --with-bundle

      # The product projection declares itself (TREE-KIND.txt, shipped by the
      # promotion overlay); the testing repository never carries the declaration.
      - name: The testing repository never declares itself the product
        run: |
          if [ -e TREE-KIND.txt ]; then
            echo "::error::TREE-KIND.txt declares the product projection; it ships only from product-only/ (engine/src/workflow/promotion/tree-kind.ts)"
            exit 1
          fi

      # A ratchet only shrinks, judged against the base the change lands on (the
      # local hook judges against HEAD; this is the server's half). On a push
      # to main there is no base to land on, and nothing to judge.
      - name: Every ratchet baseline only shrank since the base
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        working-directory: engine
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git fetch --no-tags --depth=1 "$SERVER/$REPOSITORY" "$BASE"
          node scripts/verification/ratchet-baselines.ts --check --grown-since "$BASE"

      # Tracked AND untracked: a generator that writes a new file nobody
      # committed (and no ignore rule covers) is as stale as a changed one.
      - name: Require that the generators changed no file
        run: |
          changed="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed"
            git diff --stat
            echo "::error::a generated value is stale; run 'cd engine && node src/cli.ts harness sync --with-bundle' and commit its output"
            exit 1
          fi

  # What the browser actually renders, judged by the one rule table
  # (scripts/rendered/rules.ts): the brand mark's computed paint and
  # visibility, the families text renders in, the Content-Security-Policy
  # meta tag and no violation of it, and no request leaving the origin. The rules first prove themselves on planted breaks; then every
  # cockpit view the capture walk reaches and every page of the built site
  # are judged. A static guard reads spellings; this reads the result.
  rendered:
    # The check's name is what the trunk ruleset requires: it stays "Rendered
    # pages" whatever rows the table gains (rules.ts).
    name: Rendered pages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up the engine
        uses: ./.github/actions/engine-setup
        with:
          ignore-scripts: "false"

      - name: Require the pinned compiler from the runner image
        run: |
          # gcc-14 ships in the ubuntu-24.04 image; it is probed, never installed (#333).
          command -v gcc-14 >/dev/null || { echo "::error::gcc-14 is not in the runner image; the guardian build needs it (#333)"; exit 1; }
          gcc-14 --version

      - name: Build the guardian (the cockpit's custody and checks need it)
        run: make -C engine/guardian all

      # The browser is the runner image's Google Chrome, probed like the
      # compiler, never downloaded: the rendered rules need a real browser,
      # not a pinned build (they judge computed styles, not pixels).
      - name: Require the browser from the runner image
        run: |
          command -v google-chrome >/dev/null || { echo "::error::google-chrome is not in the runner image; the rendered judgement needs a browser"; exit 1; }
          google-chrome --version
          echo "RENDERED_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - name: The rendered rules catch every planted break
        run: node --experimental-strip-types scripts/rendered/proof.ts --browser "$RENDERED_BROWSER"

      # The app runs from a scratch copy under a private temporary root, outside
      # the safety floor's keep-out (D-19): never under /tmp beside the checkout.
      - name: Judge every cockpit view as rendered
        run: |
          mkdir -p "$RUNNER_TEMP/capture"
          TMPDIR="$RUNNER_TEMP/capture" node --experimental-strip-types scripts/capture/cockpit.ts --judge-only --browser "$RENDERED_BROWSER" --demo-root "$RUNNER_TEMP/demo"

      - name: Build the site source
        run: |
          mkdir -p "$RUNNER_TEMP/versions"
          node scripts/build-site.mjs source --out .site --baseurl /rendered --versions "$RUNNER_TEMP/versions"

      - name: Build the site with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./.site
          destination: ./_site
          build_revision: ${{ github.sha }}

      - name: Judge every built page as rendered
        run: node --experimental-strip-types scripts/rendered/judge.ts site --site _site --baseurl /rendered --browser "$RENDERED_BROWSER"

  shards:
    name: Full suite shards
    uses: ./.github/workflows/test-shards.yml
    with:
      shards: "10"
      runner: ubuntu-24.04

  # The engine's own suite (engine/test, run by engine/scripts/tooling/
  # run-tests.ts, the one engine test door). It runs on every pull request
  # and main push and is NOT yet a required check: it becomes one (runbook
  # P0.9) once it is green on hosted runners, with every red fixed or filed
  # as an owned record. Its setup mirrors a shard's: the hooks, the bundle
  # and the confinement supervisor the suite's guards exercise.
  engine-suite:
    name: Engine suite
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up the engine
        uses: ./.github/actions/engine-setup
        with:
          ignore-scripts: "false"

      - name: Require the pinned compiler from the runner image
        run: |
          # gcc-14 ships in the ubuntu-24.04 image. Installing it over the
          # network only ever waited on a package mirror (a hung mirror held
          # two shards for their whole 45-minute budget, #333). A missing
          # compiler is a named failure, never an install.
          command -v gcc-14 >/dev/null || { echo "::error::gcc-14 is not in the runner image; the guardian build needs it (#333)"; exit 1; }
          gcc-14 --version

      - name: Install hooks and build the confinement supervisor
        run: |
          npm run bootstrap:hooks
          npm --prefix engine run build:bundle
          make -C engine/guardian all

      - name: Fetch the pinned corpus subset
        run: |
          npm run corpus:fetch
          npm run corpus:verify

      # The image sets kernel.apparmor_restrict_unprivileged_userns=1. The
      # namespace proofs (keep-out aliases, the procfs-less door, S1-B04/B13)
      # need unprivileged user and mount namespaces, and refuse by name
      # without them (#149): the job provides the capability, never a skip.
      - name: Allow unprivileged user and mount namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # D-19: a run's temporary root lies under the per-user cache, outside
      # the safety floor (the instrument-lock proof places a checkout there).
      - name: Run the engine suite
        run: |
          mkdir -p "$HOME/.cache/bridlewise-tmp/ci"
          TMPDIR="$HOME/.cache/bridlewise-tmp/ci" npm --prefix engine test

      # The runner writes its verdict to one summary file; the job prints the
      # failing tests and their reasons, so a red run is readable without a
      # local reproduction.
      - name: Report the engine suite's failures
        if: always()
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "engine/.bridlewise/state/test-results/latest-summary.json";
            if (!fs.existsSync(path)) { console.log("no summary: the runner recorded no result"); process.exit(0); }
            const s = JSON.parse(fs.readFileSync(path, "utf8"));
            const lines = [`## Engine suite: ${s.status}`, "", `${s.passCount} passed, ${s.failCount} failed of ${s.testCount}`, ""];
            for (const failure of s.failures) lines.push(`- ${failure}`);
            if (s.reasons.length > 0) lines.push("", "### Reasons", "", ...s.reasons.map((reason) => `- ${reason}`));
            const text = lines.join("\n") + "\n";
            process.stdout.write(text);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text);
          '

      # The same verdict as an artifact (pass/fail/total and every failure), so
      # a reader outside this run — the landing page's claims, bound to the job
      # that proves each one — reads the job's own result, not a summary of it.
      - name: Upload the engine suite's summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: engine-test-summary
          path: engine/.bridlewise/state/test-results/latest-summary.json
          if-no-files-found: error
