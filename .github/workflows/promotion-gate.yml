# GENERATED by harness sync from engine/src/workflow/gates/ — edit the owner, never this file
name: Promotion gate
"on":
  workflow_call:
    inputs:
      product_repo:
        description: Product repository
        required: true
        type: string
      product_sha:
        description: Product commit to verify
        required: true
        type: string
      product_tag:
        description: Product tag or release label
        required: true
        type: string
      testing_sha:
        description: Testing-floor commit that owns this gate
        required: true
        type: string
      wait_seconds:
        description: Wait for required product runs to finish at the commit
        required: false
        default: 0
        type: number
    outputs:
      verdict:
        description: allowed, or blocked:<reason> when the gate refuses
        value: ${{ jobs.gate.outputs.verdict }}
permissions:
  contents: read
  actions: read
  security-events: read
  vulnerability-alerts: read
jobs:
  gate:
    name: Verify product and testing evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: read
      vulnerability-alerts: read
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - name: Check out the testing floor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: LLM-4-People/bridlewise-testing
          ref: ${{ inputs.testing_sha }}
          path: testing
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            testing/package-lock.json
            testing/engine/package-lock.json
      - name: Install the public test dependencies
        working-directory: testing
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm --prefix engine ci --no-audit --no-fund --ignore-scripts
      - name: Enforce the self-protection config mode
        working-directory: testing
        run: chmod 600 engine/bridlewise.config.json
      - name: Run the public testing-floor suite
        working-directory: testing
        run: npm run test:public
      - name: Evaluate the product gates
        id: gate
        working-directory: testing
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_REPO: ${{ inputs.product_repo }}
          PRODUCT_SHA: ${{ inputs.product_sha }}
          PRODUCT_TAG: ${{ inputs.product_tag }}
          WAIT_SECONDS: ${{ inputs.wait_seconds }}
        run: |
          verdict_file="$RUNNER_TEMP/promotion-verdict.txt"
          # Seeded before the gate runs: even if it cannot start or is killed,
          # the step still publishes a refusal rather than an empty output.
          printf 'blocked:gate-did-not-run\n' > "$verdict_file"
          set +e
          node scripts/promotion-gate.mjs \
            --product "$PRODUCT_REPO" \
            --sha "$PRODUCT_SHA" \
            --tag "$PRODUCT_TAG" \
            --wait-seconds "$WAIT_SECONDS" \
            --out promotion-receipt.json \
            --verdict-out "$verdict_file"
          gate_status=$?
          set -e
          verdict="$(cat "$verdict_file")"
          case "$verdict" in
            allowed|blocked:*) ;;
            *) echo "::error::the promotion gate left no valid verdict output (got '$verdict')"; exit 1 ;;
          esac
          if [ "$gate_status" -eq 0 ] && [ "$verdict" != "allowed" ]; then
            echo "::error::the promotion gate exited 0 with verdict '$verdict'"; exit 1
          fi
          if [ "$gate_status" -ne 0 ] && [ "${verdict#blocked:}" = "$verdict" ]; then
            echo "::error::the promotion gate exited $gate_status without a blocked verdict (got '$verdict')"; exit 1
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          exit "$gate_status"
      - name: Upload the promotion receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: promotion-receipt
          path: testing/promotion-receipt.json
          if-no-files-found: warn
