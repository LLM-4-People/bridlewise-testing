# GENERATED by harness sync from engine/src/workflow/gates/ — edit the owner, never this file
name: Door
"on":
  workflow_run:
    workflows:
      - CI
    types:
      - requested
      - in_progress
      - completed
  check_run:
    types:
      - requested_action
permissions: {}
concurrency:
  group: door-${{ github.event.workflow_run.head_sha || github.event.check_run.head_sha }}-${{ github.event.action }}
  queue: max
jobs:
  stream:
    name: stream
    if: github.event_name == 'workflow_run' && github.event.action != 'completed'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: door
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json
      - name: Install engine dependencies
        run: npm --prefix engine ci --no-audit --no-fund
      - name: Enforce the self-protection config mode
        run: chmod 600 engine/bridlewise.config.json
      - name: Give the job its own temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
      - name: Mint the door App's token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOOR_APP_KEY }}
      - name: Stream the run's progress into the check
        env:
          DOOR_TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node engine/src/cli.ts harness door stream --run "$RUN_ID"
  judge:
    name: judge
    if: github.event_name == 'workflow_run' && github.event.action == 'completed'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: door
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json
      - name: Install engine dependencies
        run: npm --prefix engine ci --no-audit --no-fund
      - name: Enforce the self-protection config mode
        run: chmod 600 engine/bridlewise.config.json
      - name: Give the job its own temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
      - name: Mint the door App's token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOOR_APP_KEY }}
      - name: Refuse hostile artifacts before downloading any
        id: preflight
        env:
          DOOR_TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node engine/src/cli.ts harness door preflight --run "$RUN_ID" --github-output "$GITHUB_OUTPUT"
      - name: Download the plan
        if: ${{ steps.preflight.outputs.accepted == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate-plan
          path: ${{ runner.temp }}/ci/gate-plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download every gate result
        if: ${{ steps.preflight.outputs.accepted == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gate-results-*
          merge-multiple: true
          path: ${{ runner.temp }}/ci/results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Locate a claimed reuse
        id: claim
        if: ${{ steps.preflight.outputs.accepted == 'true' }}
        env:
          DOOR_TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node engine/src/cli.ts harness door reuse-claim --artifacts "$RUNNER_TEMP/ci" --github-output "$GITHUB_OUTPUT"
      - name: Download the claimed verdict
        if: ${{ steps.claim.outputs.door-run != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: door-verdict-${{ steps.claim.outputs.key }}-success
          path: ${{ runner.temp }}/reuse
          run-id: ${{ steps.claim.outputs.door-run }}
          github-token: ${{ github.token }}
      - name: Verify the claimed verdict's attestation
        if: ${{ steps.claim.outputs.door-run != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "$RUNNER_TEMP/reuse/keydoc.json" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/door.yml" --source-ref refs/heads/main --predicate-type https://bridlewise.dev/attestations/gate-verdict/v1 --deny-self-hosted-runners --format json > "$RUNNER_TEMP/reuse/verified.json"
      - name: Judge the run and post the verdict
        id: judge
        if: ${{ !cancelled() }}
        env:
          DOOR_TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node engine/src/cli.ts harness door judge --run "$RUN_ID" --artifacts "$RUNNER_TEMP/ci" --reuse "$RUNNER_TEMP/reuse" --out "$RUNNER_TEMP/door" --github-output "$GITHUB_OUTPUT"
      - name: Attest the verdict
        if: ${{ steps.judge.outputs.attest == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/door/keydoc.json
          predicate-type: https://bridlewise.dev/attestations/gate-verdict/v1
          predicate-path: ${{ runner.temp }}/door/predicate.json
      - name: Publish the verdict's locator
        if: ${{ steps.judge.outputs.attest == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: door-verdict-${{ steps.judge.outputs.key }}-${{ steps.judge.outputs.verdict }}
          path: ${{ runner.temp }}/door
          if-no-files-found: error
          retention-days: 90
  action:
    name: action
    if: github.event_name == 'check_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: door
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json
      - name: Install engine dependencies
        run: npm --prefix engine ci --no-audit --no-fund
      - name: Enforce the self-protection config mode
        run: chmod 600 engine/bridlewise.config.json
      - name: Give the job its own temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
      - name: Mint the door App's token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOOR_APP_KEY }}
      - name: Handle the button
        env:
          DOOR_TOKEN: ${{ steps.token.outputs.token }}
        run: node engine/src/cli.ts harness door action --event "$GITHUB_EVENT_PATH"
