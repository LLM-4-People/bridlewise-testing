name: Docs links

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's newer push supersedes its older run. Every other event
  # (main pushes, merge groups, schedules, dispatches) gets a group of its own,
  # so a main run is never cancelled, neither in progress nor pending.
  group: docs-links-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  links:
    name: Relative Markdown links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: engine/package-lock.json

      # The link classifier reads the repository identity (the forge section,
      # engine/src/workflow/forge/repository-identity.ts) through the engine's
      # own config loader, so it needs the engine's dependencies and the
      # config's protected mode; without them it dies on the first import,
      # which is not a link verdict.
      - name: Install engine dependencies
        run: npm --prefix engine ci --no-audit --no-fund

      - name: Enforce the self-protection config mode
        run: chmod 600 engine/bridlewise.config.json

      - name: Check relative links
        run: node scripts/check-docs-links.mjs
