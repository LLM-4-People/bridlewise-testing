name: Full suite shards (manual)

# The matrix is intentionally manual only. Do not add push or pull_request
# triggers until a full supported-suite run is green and the measured receipt
# is recorded in the roadmap. A red baseline must not be hidden behind a green
# shard merge or a required check.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: Number of disjoint shards
        required: true
        default: "10"
        type: choice
        options: ["4", "8", "10", "12", "16"]
      runner:
        description: Runner label. Use a larger runner class for the 10x test-phase target.
        required: true
        default: ubuntu-24.04
        type: string

permissions:
  contents: read

concurrency:
  group: test-shards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Plan the supported file set
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        run: npm --prefix engine ci --no-audit --no-fund

      - name: Enforce the self-protection config mode
        run: chmod 600 engine/bridlewise.config.json

      - name: Require the exact commit and a clean tracked tree
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Enumerate what the runner actually selects
        run: npx vitest list --filesOnly --json > "$RUNNER_TEMP/live-manifest.json"

      - name: Verify the checked-in manifest accounts for every live file
        run: |
          node scripts/test-shard-manifest.mjs verify \
            --manifest tests/test-shards.json \
            --live "$RUNNER_TEMP/live-manifest.json"

      - name: Plan deterministic weighted shards
        id: plan
        run: |
          node scripts/test-shard-manifest.mjs plan \
            --manifest tests/test-shards.json \
            --shards "${{ inputs.shards }}" \
            --head "$GITHUB_SHA" \
            --out-dir artifacts/plan \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload the plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-shard-plan
          path: artifacts/plan
          if-no-files-found: error

  shard:
    name: Shard ${{ matrix.shard }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        run: npm --prefix engine ci --no-audit --no-fund

      - name: Install hooks and build the confinement supervisor
        run: |
          npm run bootstrap:hooks
          chmod 600 engine/bridlewise.config.json
          make -C engine/guardian all

      - name: Require the exact commit and a clean tracked tree
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Download the plan
        uses: actions/download-artifact@v4
        with:
          name: test-shard-plan
          path: artifacts/plan

      - name: Select this shard's exact files
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          node -e '
            const fs = require("node:fs");
            const plan = JSON.parse(fs.readFileSync("artifacts/plan/plan.json", "utf8"));
            const shard = plan.shards.find((entry) => entry.index === Number(process.env.SHARD));
            if (!shard) throw new Error(`no shard ${process.env.SHARD} in the plan`);
            fs.writeFileSync("artifacts/files.txt", shard.files.join("\n") + "\n");
          '

      - name: Run the shard through the watchdog
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          echo "SHARD_STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"
          mapfile -t files < artifacts/files.txt
          node --experimental-strip-types scripts/run-tests.ts \
            --project=node --project=dom \
            --reporter=default \
            --reporter=json \
            --outputFile="$RUNNER_TEMP/shard-${SHARD}.vitest.json" \
            "${files[@]}"

      - name: Wrap the report with exact-commit provenance
        if: always()
        run: |
          node scripts/test-shard-manifest.mjs wrap \
            --plan artifacts/plan/plan.json \
            --vitest "$RUNNER_TEMP/shard-${{ matrix.shard }}.vitest.json" \
            --shard "${{ matrix.shard }}" \
            --started-at "$SHARD_STARTED_AT" \
            --finished-at "$(date +%s%3N)" \
            --out "artifacts/shard-${{ matrix.shard }}.json"

      - name: Upload the shard report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-shard-report-${{ matrix.shard }}
          path: artifacts/shard-${{ matrix.shard }}.json
          if-no-files-found: error

  merge:
    name: Merge one qualification receipt
    needs: [prepare, shard]
    if: always() && needs.prepare.result == 'success'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0

      - name: Download the plan
        uses: actions/download-artifact@v4
        with:
          name: test-shard-plan
          path: artifacts/plan

      - name: Download every shard report
        uses: actions/download-artifact@v4
        with:
          pattern: test-shard-report-*
          path: artifacts/shards
          merge-multiple: true

      - name: Merge and refuse missing, duplicate, failed, or wrong-commit shards
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          args=()
          for index in $(seq 1 "$SHARDS"); do
            args+=(--shard "artifacts/shards/shard-${index}.json")
          done
          node scripts/test-shard-merge.mjs \
            --manifest artifacts/plan/manifest.json \
            --plan artifacts/plan/plan.json \
            --expected-shards "$SHARDS" \
            --head "$GITHUB_SHA" \
            --runner "${{ inputs.runner }}" \
            --require-timing \
            --out test-shard-receipt.json \
            "${args[@]}"

      - name: Require the receipt to name this exact commit and plan
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const receipt = JSON.parse(fs.readFileSync("test-shard-receipt.json", "utf8"));
          const plan = JSON.parse(fs.readFileSync("artifacts/plan/plan.json", "utf8"));
          const fail = (message) => {
            console.error(`receipt refused: ${message}`);
            process.exit(1);
          };
          if (receipt.headSha !== process.env.GITHUB_SHA) fail(`headSha ${receipt.headSha} !== ${process.env.GITHUB_SHA}`);
          if (receipt.shardCount !== Number(process.env.SHARDS)) fail("shardCount mismatch");
          if (receipt.manifestHash !== plan.manifestHash) fail("manifestHash mismatch");
          if (receipt.assignmentHash !== plan.assignmentHash) fail("assignmentHash mismatch");
          if (!Number.isFinite(receipt.testPhaseMs) || receipt.testPhaseMs < 0) fail("testPhaseMs was not measured");
          if (!Number.isFinite(receipt.testPhaseCpuMs) || receipt.testPhaseCpuMs < 0) fail("testPhaseCpuMs was not measured");
          const plannedFiles = plan.shards.reduce((count, shard) => count + shard.files.length, 0);
          if (receipt.fileCount !== plannedFiles) fail("fileCount mismatch");
          NODE

      - name: Upload the receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-shard-receipt
          path: test-shard-receipt.json
          if-no-files-found: error
