name: Full suite shards

# This workflow is the one shard runner. It is called as a CI job from ci.yml
# on every push and pull request, and it remains dispatchable on its own. The
# merge job is the gate: it refuses a missing, duplicate, failed, skipped,
# unexpected, or wrong-commit shard, and it writes the receipt artifact.
on:
  workflow_call:
    inputs:
      shards:
        description: Number of disjoint shards
        required: false
        default: "10"
        type: string
      runner:
        description: Runner label. Use a larger runner class for the 10x test-phase target.
        required: false
        default: ubuntu-24.04
        type: string
  workflow_dispatch:
    inputs:
      shards:
        description: Number of disjoint shards
        required: true
        default: "10"
        type: choice
        options: ["1", "4", "8", "10", "12", "16"]
      runner:
        description: Runner label. Use a larger runner class for the 10x test-phase target.
        required: true
        default: ubuntu-24.04
        type: string

permissions:
  contents: read

concurrency:
  # A pull request's runs share one group (CI, the caller, cancels the
  # superseded one). Every other event (main pushes, merge groups, dispatches)
  # gets a group of its own, so a main run is never cancelled, even pending.
  group: test-shards-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Plan the supported file set
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up the engine
        uses: ./.github/actions/engine-setup
        with:
          ignore-scripts: "true"

      - name: Require the exact commit and a clean tracked tree
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      # The listing runs vitest through the one test-execution door, confined
      # (decision TEST-CONFINEMENT-SELF-BIND): admitted as in the shard job.
      - name: Admit user namespaces for the test supervisor alone
        run: sh -ec "$(node engine/guardian/build.ts --apparmor-install)"

      - name: Enumerate what the runner actually selects
        run: npm run test:list -- --out "$RUNNER_TEMP/live-manifest.json"

      - name: Verify the derived population is the runner's selection
        run: |
          npm run test:verify-shards -- \
            --live "$RUNNER_TEMP/live-manifest.json"

      - name: Plan deterministic weighted shards
        id: plan
        run: |
          node scripts/test-shard-manifest.mjs plan \
            --weights tests/test-weights.json \
            --shards "${{ inputs.shards }}" \
            --head "$GITHUB_SHA" \
            --out-dir "$RUNNER_TEMP/shard-plan" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload the plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-shard-plan
          path: ${{ runner.temp }}/shard-plan
          if-no-files-found: error

  shard:
    name: Shard ${{ matrix.shard }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up the engine
        uses: ./.github/actions/engine-setup
        with:
          ignore-scripts: "false"

      - name: Require the pinned compiler from the runner image
        run: |
          # gcc-14 ships in the ubuntu-24.04 image. Installing it over the
          # network only ever waited on a package mirror (a hung mirror held
          # two shards for their whole 45-minute budget, #333). A missing
          # compiler is a named failure, never an install.
          command -v gcc-14 >/dev/null || { echo "::error::gcc-14 is not in the runner image; the guardian build needs it (#333)"; exit 1; }
          gcc-14 --version

      - name: Install hooks and build the confinement supervisor
        run: |
          npm run bootstrap:hooks
          npm --prefix engine run build:bundle
          make -C engine/guardian all

      # Every test run is confined in unprivileged user namespaces (the one
      # test-execution door, decision TEST-CONFINEMENT-SELF-BIND). The image's
      # AppArmor restricts those; the contributor setup admits them for this
      # checkout's test supervisor at its exact path (CONTRIBUTING's one-time
      # step), never a global sysctl: CI and a contributor's machine run the
      # same setup.
      - name: Admit user namespaces for the test supervisor alone
        run: sh -ec "$(node engine/guardian/build.ts --apparmor-install)"

      - name: Record the guardian build stamp and diagnostic digest
        run: |
          set -o pipefail
          engine/guardian/build/harness-landlock-guardian --stamp | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum engine/guardian/build/harness-landlock-guardian | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Require the exact commit and a clean tracked tree
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-shard-plan
          path: ${{ runner.temp }}/shard-plan

      - name: Select this shard's exact files
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          node -e '
            const fs = require("node:fs");
            const plan = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/shard-plan/plan.json`, "utf8"));
            const shard = plan.shards.find((entry) => entry.index === Number(process.env.SHARD));
            if (!shard) throw new Error(`no shard ${process.env.SHARD} in the plan`);
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/shard-files.txt`, shard.files.join("\n") + "\n");
          '

      - name: Run the shard through the watchdog
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          echo "SHARD_STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"
          mapfile -t files < "$RUNNER_TEMP/shard-files.txt"
          node --experimental-strip-types scripts/run-tests.ts \
            --project=node --project=dom \
            --reporter=default \
            --reporter=json \
            --outputFile="$RUNNER_TEMP/shard-${SHARD}.vitest.json" \
            "${files[@]}"

      - name: Wrap the report with exact-commit provenance
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/shard-reports"
          node scripts/test-shard-manifest.mjs wrap \
            --plan "$RUNNER_TEMP/shard-plan/plan.json" \
            --vitest "$RUNNER_TEMP/shard-${{ matrix.shard }}.vitest.json" \
            --shard "${{ matrix.shard }}" \
            --started-at "$SHARD_STARTED_AT" \
            --finished-at "$(date +%s%3N)" \
            --out "$RUNNER_TEMP/shard-reports/shard-${{ matrix.shard }}.json"

      - name: Upload the shard report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-shard-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-reports/shard-${{ matrix.shard }}.json
          if-no-files-found: error

  merge:
    name: Merge one qualification receipt
    needs: [prepare, shard]
    # This job IS the required check, so it always runs: a skipped job reports
    # "skipped", which GitHub counts as a pass. A failed plan fails it here.
    if: always()
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - name: Require a successful shard plan
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: |
          if [ "$PREPARE_RESULT" != "success" ]; then
            echo "::error::the shard plan did not succeed ($PREPARE_RESULT); no receipt can certify this commit"
            exit 1
          fi

      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-shard-plan
          path: ${{ runner.temp }}/shard-plan

      - name: Download every shard report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-shard-report-*
          path: ${{ runner.temp }}/shard-reports
          merge-multiple: true

      - name: Merge and refuse missing, duplicate, failed, or wrong-commit shards
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          args=()
          for index in $(seq 1 "$SHARDS"); do
            args+=(--shard "$RUNNER_TEMP/shard-reports/shard-${index}.json")
          done
          node scripts/test-shard-merge.mjs \
            --manifest "$RUNNER_TEMP/shard-plan/manifest.json" \
            --weights tests/test-weights.json \
            --plan "$RUNNER_TEMP/shard-plan/plan.json" \
            --expected-shards "$SHARDS" \
            --head "$GITHUB_SHA" \
            --runner "${{ inputs.runner }}" \
            --require-timing \
            --out "$RUNNER_TEMP/test-shard-receipt.json" \
            "${args[@]}"

      - name: Require the receipt to name this exact commit and plan
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import { readShardPopulation } from "./scripts/test-shard-manifest.mjs";
          const receipt = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/test-shard-receipt.json`, "utf8"));
          const plan = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/shard-plan/plan.json`, "utf8"));
          // The exclusions each test file declares in its own header, read from this tree.
          const source = readShardPopulation(process.cwd(), "tests/test-weights.json");
          const fail = (message) => {
            console.error(`receipt refused: ${message}`);
            process.exit(1);
          };
          if (receipt.headSha !== process.env.GITHUB_SHA) fail(`headSha ${receipt.headSha} !== ${process.env.GITHUB_SHA}`);
          if (receipt.shardCount !== Number(process.env.SHARDS)) fail("shardCount mismatch");
          if (receipt.manifestHash !== plan.manifestHash) fail("manifestHash mismatch");
          if (receipt.assignmentHash !== plan.assignmentHash) fail("assignmentHash mismatch");
          if (!Number.isFinite(receipt.testPhaseMs) || receipt.testPhaseMs < 0) fail("testPhaseMs was not measured");
          if (!Number.isFinite(receipt.testPhaseCpuMs) || receipt.testPhaseCpuMs < 0) fail("testPhaseCpuMs was not measured");
          const plannedFiles = plan.shards.reduce((count, shard) => count + shard.files.length, 0);
          if (receipt.fileCount !== plannedFiles) fail("fileCount mismatch");
          const plannedSet = new Set(plan.shards.flatMap((shard) => shard.files));
          if (plannedSet.size !== plannedFiles) fail("the plan repeats a file");
          if (receipt.passedTests !== receipt.testCount) fail("passedTests does not equal testCount");
          if (receipt.failedTests !== 0) fail("failedTests is not zero");
          if (receipt.skippedTests !== 0) fail("skippedTests is not zero");
          if (receipt.excludedFileCount !== source.excluded.length) {
            fail(`excludedFileCount ${receipt.excludedFileCount} !== ${source.excluded.length}`);
          }
          if (!Array.isArray(receipt.exclusions)) fail("exclusions are missing");
          for (const exclusion of source.excluded) {
            const named = receipt.exclusions.find((entry) => entry.path === exclusion.path);
            if (!named) fail(`excluded file is missing from the receipt: ${exclusion.path}`);
            if (named.reason !== exclusion.reason) fail(`exclusion reason changed: ${exclusion.path}`);
            if (named.evidence !== exclusion.evidence) fail(`exclusion evidence changed: ${exclusion.path}`);
          }
          NODE

      - name: Upload the receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-shard-receipt
          path: ${{ runner.temp }}/test-shard-receipt.json
          if-no-files-found: error
