# GENERATED by harness sync from engine/src/workflow/gates/ — edit the owner, never this file
name: Docs site
"on":
  push:
    branches:
      - main
  pull_request: {}
  merge_group: {}
  workflow_dispatch:
    inputs:
      supersede_published:
        description: "Only to recover a refused deploy (runbook P6): the exact commit the live site was built from, as the refusal names it, or 'unknown'"
        required: false
        default: ""
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || format('pages-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build the site
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
      actions: read
      security-events: read
      vulnerability-alerts: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Collect the released docs snapshots
        run: mkdir -p "$RUNNER_TEMP/versions"
      - name: Install the engine (the builder and the floor read through the forge port)
        run: npm --prefix engine ci --no-audit --no-fund --ignore-scripts
      - name: Enforce the self-protection config mode
        run: chmod 600 engine/bridlewise.config.json
      - name: Build the site source
        env:
          BASEURL: ${{ steps.pages.outputs.base_path }}
        run: node scripts/build-site.mjs source --out .site --baseurl "$BASEURL" --versions "$RUNNER_TEMP/versions"
      - name: Generate floor data
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-floor-data.mjs --root . --out .site/floor/data
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./.site
          destination: ./_site
          build_revision: ${{ github.sha }}
      - name: Merge the snapshots and check links and design
        env:
          BASEURL: ${{ steps.pages.outputs.base_path }}
        run: node scripts/build-site.mjs finish --site _site --baseurl "$BASEURL" --versions "$RUNNER_TEMP/versions"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./_site
          include-hidden-files: true
  approve-override:
    name: Approve the deploy-order override
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.supersede_published != ''
    needs:
      - build
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    environment:
      name: pages-override
    steps:
      - name: Record the approved override
        env:
          SUPERSEDE: ${{ inputs.supersede_published }}
        run: echo "::notice title=Pages deploy-order override::approved to replace the site published from $SUPERSEDE"
  deploy:
    name: Deploy to GitHub Pages
    if: always() && needs.build.result == 'success' && (needs.approve-override.result == 'success' || needs.approve-override.result == 'skipped') && github.event.repository.visibility == 'public' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs:
      - build
      - approve-override
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages-deploy
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install the engine (the check reads GitHub through the forge port)
        run: npm --prefix engine ci --no-audit --no-fund --ignore-scripts
      - name: Enforce the self-protection config mode
        run: chmod 600 engine/bridlewise.config.json
      - name: Check the deploy order
        id: order
        env:
          GH_TOKEN: ${{ github.token }}
          SUPERSEDE: ${{ inputs.supersede_published }}
        run: node scripts/floor/deploy-order.mjs --sha "$GITHUB_SHA" --supersede "$SUPERSEDE"
      - name: Deploy
        id: deployment
        if: steps.order.outputs.deploy == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
