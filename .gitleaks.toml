# Gitleaks configuration for the public development-floor snapshot.
title = "Bridlewise testing floor"

[extend]
useDefault = true

[allowlist]
description = "Synthetic test fixtures (test and bench trees only) and exact placeholder values"
paths = [
  '''engine/test/.*''',
  '''tests/.*''',
  '''bench/.*''',
]
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''sk-\.\.\.''',
  '''sk-AAAAAAAAAAAAAAAAAAAAAAAA''',
  '''ghp_AAAAAAAAAAAAAAAAAAAAAAAA''',
  '''sk_abcdefghijklmnopqrstuvwx''',
  '''ghp_abcdefghijklmnopqrstuvwx''',
  '''sk-abcdefghijklmnopqrstuvwxyz123456''',
]
